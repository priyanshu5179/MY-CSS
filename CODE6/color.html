<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Colors in CSS</title>

    <style>
        /* RGB Color */
        h1 {
            color: rgb(237, 237, 12);
        }

        /* HEX Color */
        p {
            color: #3B1E1C;
        }

        /* RGBA Color */
        li:nth-child(1) {
            color: rgba(45, 54, 45, 0.6);
        }

        /* HSL Color */
        li:nth-child(2) {
            color: hsl(6, 30%, 40%);
        }

        /* Color Keyword */
        li:nth-child(3) {
            color: red;
        }
    </style>
</head>

<body>

    <h1>Let's Learn About Colors</h1>

    <p>Colors can be represented in different ways:</p>

    <ol>
        <li>HEX</li>
        <li>RGB</li>
        <li>RGBA</li>
        <li>HSL</li>
        <li>Color Keyword</li>
    </ol>

</body>

</html>
